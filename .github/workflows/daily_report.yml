name: Daily SE Internship Digest

on:
  schedule:
    # 7:48 AM Asia/Colombo (UTC+5:30) is 2:18 AM UTC (off-peak minute to avoid GitHub runner queue delays)
    - cron: '18 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write # Allows saving updated subscribers.json to repository

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright & Headless Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Internship Digest & Sync Subscribers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SUBSCRIBERS_GIST_ID: ${{ secrets.SUBSCRIBERS_GIST_ID }}
        run: python main.py
